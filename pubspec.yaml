name: eventura
description: "Développement du projet tutoré."

publish_to: "none"

version: 1.0.0+1

environment:
    sdk: ^3.7.0

dependencies:
    flutter:
        sdk: flutter

    cupertino_icons: ^1.0.8
    supabase_flutter: ^2.8.3
    flutter_dotenv: ^5.1.0
    provider: ^6.1.2
    logger: ^2.5.0
    mocktail: ^1.0.4
    http: ^1.3.0
    flutter_launcher_icons: ^0.13.1
    shared_preferences: ^2.5.3
    collection: ^1.19.1
    google_fonts: ^6.2.1

dev_dependencies:
    flutter_test:
        sdk: flutter

    flutter_lints: ^5.0.0
    test: ^1.25.7
    mockito: ^5.4.5
    build_runner: ^2.4.15
    mock_supabase_http_client: ^0.0.3+1

flutter:
    uses-material-design: true
    assets:
        - .env
        - assets/icon/icon.png

flutter_launcher_icons:
    android: "launcher_icon"
    ios: true
    image_path: "assets/icon/icon.png"
